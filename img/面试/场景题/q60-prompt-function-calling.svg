<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" width="880" height="548"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="548" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
      --c-warning: #f59e0b; --c-warning-soft: #fffbeb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
        --c-warning: #fbbf24; --c-warning-soft: #451a03;
      }
    }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .box-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .box-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .box-warning { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 2; }
    .step-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
    .step-text { font-size: 13px; fill: var(--c-text); }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .arrow-brand { stroke: var(--c-brand); stroke-width: 2; fill: none; }
    .arrow-success { stroke: var(--c-success); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ax-q60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
    <marker id="ax-q60-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-brand)"/>
    </marker>
    <marker id="ax-q60-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-success)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">LLM 调用 + Function Calling 完整流程</text>
  <text x="40" y="62" class="subtitle">系统提示 + 用户问题 → LLM → 工具调用 → 最终回复</text>

  <!-- Step 1: 用户输入 -->
  <g>
    <rect x="40" y="100" width="180" height="60" class="box" rx="6"/>
    <text x="130" y="125" class="step-title" text-anchor="middle">① 用户输入</text>
    <text x="130" y="148" class="step-text" text-anchor="middle">"我的订单到哪了？"</text>
  </g>

  <line x1="220" y1="130" x2="260" y2="130" class="arrow" marker-end="url(#ax-q60)"/>

  <!-- Step 2: Prompt 拼装 -->
  <g>
    <rect x="265" y="100" width="200" height="60" class="box-warning" rx="6"/>
    <text x="365" y="125" class="step-title" text-anchor="middle">② Prompt 模板</text>
    <text x="365" y="148" class="step-text" text-anchor="middle">system + few-shot + user</text>
  </g>

  <line x1="465" y1="130" x2="505" y2="130" class="arrow-brand" marker-end="url(#ax-q60-b)"/>

  <!-- Step 3: LLM 推理 -->
  <g>
    <rect x="510" y="100" width="160" height="60" class="box-brand" rx="6"/>
    <text x="590" y="125" class="step-title" text-anchor="middle">③ LLM 推理</text>
    <text x="590" y="148" class="step-text" text-anchor="middle">GPT-4 / DeepSeek</text>
  </g>

  <!-- 分支 1: 直接回答 -->
  <line x1="670" y1="120" x2="700" y2="120" class="arrow-success" marker-end="url(#ax-q60-s)"/>
  <rect x="700" y="100" width="140" height="40" class="box-success" rx="4"/>
  <text x="770" y="125" class="step-text" text-anchor="middle">✓ 直接回答</text>

  <!-- 分支 2: 需要工具 -->
  <line x1="670" y1="145" x2="700" y2="200" class="arrow-brand" marker-end="url(#ax-q60-b)"/>
  <rect x="700" y="185" width="140" height="40" class="box-warning" rx="4"/>
  <text x="770" y="210" class="step-text" text-anchor="middle">⚙ tool_calls</text>

  <!-- Step 4: Function Calling -->
  <g>
    <rect x="40" y="260" width="800" height="120" class="box-brand" rx="6"/>
    <text x="60" y="285" class="step-title" style="fill: var(--c-brand);">④ Function Calling（结构化输出）</text>

    <text x="60" y="315" class="code">tools = [{</text>
    <text x="68" y="333" class="code">  type: 'function',</text>
    <text x="68" y="351" class="code">  function: { name: 'getOrder', parameters: { orderId: string } }</text>
    <text x="60" y="369" class="code">}]</text>

    <text x="430" y="315" class="code" style="font-weight: 700;">LLM 输出：</text>
    <text x="430" y="333" class="code">{</text>
    <text x="438" y="351" class="code" style="fill: var(--c-brand);">  name: 'getOrder', arguments: '{ orderId: \"123\" }'</text>
    <text x="430" y="369" class="code">}</text>
  </g>

  <!-- Step 5: 执行工具 -->
  <g>
    <rect x="40" y="400" width="380" height="60" class="box-success" rx="6"/>
    <text x="60" y="425" class="step-title" style="fill: var(--c-success);">⑤ 后端执行工具</text>
    <text x="60" y="445" class="code">const order = await api.getOrder(orderId)</text>
    <text x="60" y="463" class="step-text" style="font-size: 13px;">返回：{ status: '已发货', eta: '明天到达' }</text>
  </g>

  <line x1="420" y1="430" x2="470" y2="430" class="arrow-success" marker-end="url(#ax-q60-s)"/>

  <!-- Step 6: 喂回 LLM -->
  <g>
    <rect x="470" y="400" width="370" height="60" class="box-warning" rx="6"/>
    <text x="490" y="425" class="step-title" style="fill: var(--c-warning);">⑥ 结果喂回 LLM</text>
    <text x="490" y="445" class="code">messages.push({ role: 'tool', content: '...' })</text>
    <text x="490" y="463" class="step-text" style="font-size: 13px;">LLM 基于工具结果生成最终回复</text>
  </g>

  <!-- Step 7: 最终回复 -->
  <rect x="40" y="485" width="800" height="40" style="fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2;" rx="6"/>
  <text x="60" y="510" class="step-title" style="fill: var(--c-success);">⑦ 最终回复：</text>
  <text x="160" y="510" class="step-text">"您的订单 123 已发货，预计明天到达 ✈"</text>
</svg>