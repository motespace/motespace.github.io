<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root {
      --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
      }
    }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .queue-box { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .req-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .req-active { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .req-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1; }
    .step-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
    .step-text { font-size: 13px; fill: var(--c-text); }
    .code { font-family: Consolas, Monaco, monospace; font-size: 12px; fill: var(--c-text); }
    .req-num { font-size: 14px; font-weight: 700; fill: var(--c-brand); }
    .center { text-anchor: middle; }
    .small { font-size: 11px; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .arrow-brand { stroke: var(--c-brand); stroke-width: 2; fill: none; }
    .arrow-success { stroke: var(--c-success); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ax-q21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3451b2"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">串行请求队列（同 key 不并发）</text>
  <text x="40" y="62" class="subtitle">5 个 uploadFile 并发调用 → 实际按 1→2→3→4→5 顺序执行</text>

  <g>
    <rect x="40" y="100" width="160" height="370" class="queue-box" rx="6"/>
    <text x="120" y="125" class="step-title center">请求队列</text>
    <text x="120" y="142" class="step-text center small">RequestQueue.enqueue()</text>

    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="120" height="50" class="req-success" rx="4"/>
      <text x="60" y="22" class="req-num center">请求 1</text>
      <text x="60" y="38" class="step-text center small">✓ 已完成</text>
    </g>
    <g transform="translate(60, 220)">
      <rect x="0" y="0" width="120" height="50" class="req-active" rx="4"/>
      <text x="60" y="22" class="req-num center">请求 2</text>
      <text x="60" y="38" class="step-text center small">⏳ 执行中</text>
    </g>
    <g transform="translate(60, 280)">
      <rect x="0" y="0" width="120" height="50" class="req-box" rx="4"/>
      <text x="60" y="22" class="req-num center">请求 3</text>
      <text x="60" y="38" class="step-text center small">排队中</text>
    </g>
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="120" height="50" class="req-box" rx="4"/>
      <text x="60" y="22" class="req-num center">请求 4</text>
      <text x="60" y="38" class="step-text center small">排队中</text>
    </g>
    <g transform="translate(60, 400)">
      <rect x="0" y="0" width="120" height="50" class="req-box" rx="4"/>
      <text x="60" y="22" class="req-num center">请求 5</text>
      <text x="60" y="38" class="step-text center small">排队中</text>
    </g>
  </g>

  <g>
    <line x1="200" y1="100" x2="200" y2="470" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="220" y="180" class="step-text" style="font-weight: 700;">t = 0s</text>
    <text x="220" y="200" class="code">调用 uploadFile()</text>
    <text x="220" y="216" class="code">→ 入队，执行</text>

    <text x="220" y="248" class="step-text" style="font-weight: 700;">t = 2s</text>
    <text x="220" y="268" class="code">请求 1 完成</text>
    <text x="220" y="284" class="code">→ 请求 2 开始</text>

    <text x="220" y="316" class="step-text" style="font-weight: 700;">t = 4s</text>
    <text x="220" y="336" class="code">请求 2 完成</text>
    <text x="220" y="352" class="code">→ 请求 3 开始</text>

    <text x="220" y="384" class="step-text" style="font-weight: 700;">t = 6s</text>
    <text x="220" y="404" class="code">...</text>
    <text x="220" y="420" class="code">（依此类推）</text>
  </g>

  <g>
    <rect x="490" y="100" width="350" height="220" class="queue-box" rx="6"/>
    <text x="510" y="128" class="step-title">核心实现</text>

    <text x="510" y="155" class="code">class RequestQueue {</text>
    <text x="518" y="173" class="code">private pending = null;</text>

    <text x="510" y="198" class="code">enqueue(task) {</text>
    <text x="518" y="216" class="code">const next = (this.pending || Promise.resolve())</text>
    <text x="526" y="234" class="code">.then(() =&gt; task());</text>
    <text x="518" y="252" class="code">this.pending = next.catch(() =&gt; {});</text>
    <text x="510" y="270" class="code">return next;</text>
    <text x="510" y="288" class="code">}</text>
    <text x="510" y="306" class="code">}</text>
  </g>

  <g>
    <rect x="490" y="340" width="350" height="130" class="req-active" rx="6"/>
    <text x="510" y="365" class="step-title">典型场景</text>
    <text x="510" y="388" class="step-text">• 上传文件（避免 OSS 限流）</text>
    <text x="510" y="408" class="step-text">• 写操作（同用户顺序）</text>
    <text x="510" y="428" class="step-text">• 第三方接口（带 rate limit）</text>
    <text x="510" y="448" class="step-text">• 按 serialKey 分组（不同 key 不阻塞）</text>
  </g>

  <text x="40" y="495" class="subtitle">⚠ catch 必须加：防止 unhandled rejection 让队列永久阻塞</text>
</svg>