<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="500" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
      --c-danger: #ef4444; --c-danger-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
        --c-danger: #f87171; --c-danger-soft: #7f1d1d;
      }
    }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .lane-bg { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .lane-label { font-size: 15px; font-weight: 600; fill: var(--c-text); }
    .lifeline { stroke: var(--c-border); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .msg-line { stroke-width: 1.8; fill: none; }
    .msg-brand { stroke: var(--c-brand); }
    .msg-error { stroke: var(--c-danger); }
    .msg-success { stroke: var(--c-success); }
    .msg-label { font-size: 13px; fill: var(--c-text); }
    .msg-label-bg { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 0.5; }
    .step-num { font-size: 15px; font-weight: 700; fill: var(--c-brand); }
    .step-text { font-size: 14px; fill: var(--c-text); }
    .box-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step { opacity: 0; animation: fadeUp 0.4s ease-out forwards; }
    .step-1 { animation-delay: 0.2s; }
    .step-2 { animation-delay: 1.0s; }
    .step-3 { animation-delay: 2.0s; }
    .step-4 { animation-delay: 3.0s; }
    .step-5 { animation-delay: 4.0s; }
    @media (prefers-reduced-motion: reduce) {
      .step { opacity: 1; animation: none; }
    }
  </style>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-brand)"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-danger)"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-success)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">401 刷新 Token：单例 Promise 共享</text>
  <text x="40" y="62" class="subtitle">10 个并发请求 → 1 个 refresh → 全部 retry 用新 token</text>

  <g>
    <rect x="40" y="90" width="220" height="370" class="lane-bg" rx="6"/>
    <text x="150" y="115" class="lane-label" text-anchor="middle">浏览器页面</text>
    <rect x="290" y="90" width="220" height="370" class="lane-bg" rx="6"/>
    <text x="400" y="115" class="lane-label" text-anchor="middle">Axios 拦截器</text>
    <rect x="540" y="90" width="220" height="370" class="lane-bg" rx="6"/>
    <text x="650" y="115" class="lane-label" text-anchor="middle">后端接口</text>
  </g>

  <line x1="150" y1="130" x2="150" y2="450" class="lifeline"/>
  <line x1="400" y1="130" x2="400" y2="450" class="lifeline"/>
  <line x1="650" y1="130" x2="650" y2="450" class="lifeline"/>

  <g class="step step-1">
    <text x="65" y="160" class="step-num">①</text>
    <text x="90" y="160" class="step-text">10 个请求并发（带过期 token）</text>
    <line x1="150" y1="170" x2="390" y2="170" class="msg-line msg-brand" marker-end="url(#arrow1)"/>
    <rect x="180" y="155" width="200" height="22" class="msg-label-bg" rx="3"/>
    <text x="190" y="170" class="msg-label">并发 10 个 GET/POST 请求</text>
  </g>

  <g class="step step-2">
    <text x="65" y="205" class="step-num">②</text>
    <text x="90" y="205" class="step-text">10 个请求全部返回 401</text>
    <line x1="390" y1="215" x2="160" y2="215" class="msg-line msg-error" marker-end="url(#arrow2)"/>
    <rect x="170" y="200" width="220" height="22" class="msg-label-bg" rx="3"/>
    <text x="180" y="215" class="msg-label">401 Unauthorized × 10</text>
  </g>

  <g class="step step-3">
    <text x="65" y="250" class="step-num">③</text>
    <text x="90" y="250" class="step-text">拦截器：仅第 1 个 401 触发 refresh</text>
    <line x1="400" y1="260" x2="640" y2="260" class="msg-line msg-brand" marker-end="url(#arrow1)"/>
    <rect x="430" y="245" width="200" height="22" class="msg-label-bg" rx="3"/>
    <text x="440" y="260" class="msg-label">POST /auth/refresh</text>

    <rect x="310" y="285" width="180" height="80" class="box-brand" rx="4"/>
    <text x="320" y="303" class="step-text" style="font-weight: 700; fill: var(--c-brand);">共享 refreshing Promise</text>
    <text x="320" y="322" class="code">if (refreshing) {</text>
    <text x="328" y="338" class="code">  return refreshing</text>
    <text x="320" y="354" class="code">}</text>
  </g>

  <g class="step step-4">
    <text x="65" y="385" class="step-num">④</text>
    <text x="90" y="385" class="step-text">拿到新 token，存 storage</text>
    <line x1="640" y1="395" x2="410" y2="395" class="msg-line msg-success" marker-end="url(#arrow3)"/>
    <rect x="430" y="380" width="200" height="22" class="msg-label-bg" rx="3"/>
    <text x="440" y="395" class="msg-label">200 { token: "new..." }</text>
  </g>

  <g class="step step-5">
    <text x="65" y="425" class="step-num">⑤</text>
    <text x="90" y="425" class="step-text">10 个请求用新 token 重试</text>
    <line x1="400" y1="435" x2="640" y2="435" class="msg-line msg-success" marker-end="url(#arrow3)"/>
    <rect x="430" y="420" width="200" height="22" class="msg-label-bg" rx="3"/>
    <text x="440" y="435" class="msg-label">10 个请求并发 retry 成功</text>
  </g>
</svg>