<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<style>
:root { --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; }
@media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; } }
.title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
.subtitle { font-size: 14px; fill: var(--c-text-soft); }
.thread-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
.thread-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
.thread-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
.label { font-size: 16px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
.item { font-size: 12px; fill: var(--c-text); text-anchor: middle; }
.code { font-family: Consolas, Monaco, monospace; font-size: 11px; fill: var(--c-text); text-anchor: middle; }
.bridge { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 2; stroke-dasharray: 4 3; }
</style>
<text x="40" y="40" class="title">微信小程序双线程架构</text>
<text x="40" y="62" class="subtitle">逻辑层（JSCore）与视图层（WebView）通过 JSBridge 通信</text>
<rect x="60" y="100" width="320" height="280" class="thread-brand" rx="8"/>
<text x="220" y="130" class="label" style="fill: var(--c-brand);">逻辑层</text>
<text x="220" y="148" class="item">JSCore / V8 引擎</text>
<rect x="80" y="170" width="280" height="50" class="thread-box" rx="4"/>
<text x="220" y="195" class="item" style="font-weight: 700;">App Service</text>
<text x="220" y="212" class="code">app.js / 业务逻辑</text>
<rect x="80" y="230" width="280" height="50" class="thread-box" rx="4"/>
<text x="220" y="255" class="item" style="font-weight: 700;">setData / API</text>
<text x="220" y="272" class="code">wx.request / wx.login</text>
<rect x="80" y="290" width="280" height="50" class="thread-box" rx="4"/>
<text x="220" y="315" class="item" style="font-weight: 700;">数据处理</text>
<text x="220" y="332" class="code">序列化 + 跨线程</text>
<rect x="500" y="100" width="320" height="280" class="thread-success" rx="8"/>
<text x="660" y="130" class="label" style="fill: var(--c-success);">视图层</text>
<text x="660" y="148" class="item">多个 WebView 进程</text>
<rect x="520" y="170" width="280" height="50" class="thread-box" rx="4"/>
<text x="660" y="195" class="item" style="font-weight: 700;">页面 WebView</text>
<text x="660" y="212" class="code">每个 page 一个</text>
<rect x="520" y="230" width="280" height="50" class="thread-box" rx="4"/>
<text x="660" y="255" class="item" style="font-weight: 700;">WXML / WXSS</text>
<text x="660" y="272" class="code">Web 渲染引擎</text>
<rect x="520" y="290" width="280" height="50" class="thread-box" rx="4"/>
<text x="660" y="315" class="item" style="font-weight: 700;">事件处理</text>
<text x="660" y="332" class="code">点击 / 滑动 → 回调</text>
<rect x="380" y="180" width="120" height="140" class="bridge" rx="4"/>
<text x="440" y="210" class="label" style="fill: var(--c-warning);">JSBridge</text>
<text x="440" y="232" class="item" style="font-size: 11px;">异步通信</text>
<text x="440" y="252" class="item" style="font-size: 11px;">数据序列化</text>
<text x="440" y="272" class="item" style="font-size: 11px;">跨进程</text>
<text x="40" y="415" class="item" style="font-weight: 700;">⚡ 双线程：隔离 JS / 防止阻塞 UI / setData 是性能瓶颈</text>
<text x="40" y="438" class="item">• 逻辑层不能直接操作 DOM</text>
<text x="40" y="458" class="item">• 跨线程通信是性能关键</text>
<text x="40" y="478" class="item">• 减少 setData 调用频率和大小</text>
</svg>