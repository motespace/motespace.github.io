<svg xmlns="http://www.w3.org/2000/svg" viewBox="-54 0 917 513" width="917" height="513" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="-54" y="0" width="917" height="513" fill="var(--c-bg)"/>

<style>
:root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; }
@media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; } }
.title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
.subtitle { font-size: 14px; fill: var(--c-text-soft); }
.stage-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
.stage-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
.stage-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
.arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
.label { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
.code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
.section-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
.item { font-size: 13px; fill: var(--c-text); }
</style>
<defs>
<marker id="ax-n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
</marker>
</defs>
<text x="40" y="40" class="title">Next.js App Router 渲染流程</text>
<text x="40" y="62" class="subtitle">Server Components + Client Components + RSC Payload</text>
<rect x="40" y="100" width="800" height="180" class="stage-box" rx="6"/>
<text x="60" y="125" class="section-title">渲染流程（4 个阶段）</text>
<rect x="60" y="155" width="180" height="50" class="stage-brand" rx="4"/>
<text x="150" y="180" class="label">① RSC 渲染</text>
<text x="150" y="197" class="code" text-anchor="middle">Server Component 树</text>
<rect x="260" y="155" width="180" height="50" class="stage-success" rx="4"/>
<text x="350" y="180" class="label">② 客户端边界</text>
<text x="350" y="197" class="code" text-anchor="middle">"use client" 标记</text>
<rect x="460" y="155" width="180" height="50" class="stage-success" rx="4"/>
<text x="550" y="180" class="label">③ RSC Payload</text>
<text x="550" y="197" class="code" text-anchor="middle">序列化 + 流式</text>
<rect x="660" y="155" width="160" height="50" class="stage-success" rx="4"/>
<text x="740" y="180" class="label">④ Hydration</text>
<text x="740" y="197" class="code" text-anchor="middle">客户端接管</text>
<text x="40" y="305" class="section-title">⚡ Server vs Client 组件</text>
<rect x="40" y="330" width="380" height="160" style="fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1;" rx="6"/>
<text x="60" y="355" class="label" text-anchor="start" style="fill: var(--c-brand); font-size: 14px;">Server Component（默认）</text>
<text x="60" y="378" class="item">• 直接访问数据库 / 文件系统</text>
<text x="60" y="398" class="item">• 不发送 JS 到客户端（bundle 0KB）</text>
<text x="60" y="418" class="item">• 不能用 useState / useEffect</text>
<text x="60" y="438" class="item">• 不能用 onClick 等事件</text>
<text x="60" y="460" class="item" style="font-weight: 700;">⚠ async function + 直接 await db</text>
<rect x="460" y="330" width="380" height="160" style="fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1;" rx="6"/>
<text x="480" y="355" class="label" text-anchor="start" style="fill: var(--c-success); font-size: 14px;">Client Component（"use client"）</text>
<text x="480" y="378" class="item">• 可以用 useState / useEffect</text>
<text x="480" y="398" class="item">• 可以用 onClick 等事件</text>
<text x="480" y="418" class="item">• JS 打包发送到浏览器</text>
<text x="480" y="438" class="item">• 仍可在服务端预渲染（SSR）</text>
<text x="480" y="460" class="item" style="font-weight: 700;">⚠ 树的下层都是 client</text>
</svg>