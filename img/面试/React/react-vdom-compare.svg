<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 503" width="880" height="503"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="503" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .col-bg { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .col-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .col-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .col-title { font-size: 18px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .check { font-size: 14px; font-weight: 700; fill: var(--c-success); }
    .cross { font-size: 14px; font-weight: 700; fill: var(--c-danger); }
    .item { font-size: 13px; fill: var(--c-text); }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
  </style>

  <text x="40" y="40" class="title">Real DOM vs Virtual DOM</text>
  <text x="40" y="62" class="subtitle">虚拟 DOM 通过 diff 算法最小化真实 DOM 操作</text>

  <rect x="40" y="100" width="400" height="380" class="col-brand" rx="8"/>
  <text x="240" y="135" class="col-title">Real DOM（真实 DOM）</text>

  <text x="60" y="170" class="item" style="font-weight: 700;">本质</text>
  <text x="60" y="190" class="item">浏览器解析 HTML 后生成的树</text>
  <text x="60" y="210" class="code">document.body / document.createElement('div')</text>

  <text x="60" y="245" class="item" style="font-weight: 700;">操作成本</text>
  <text x="60" y="265" class="cross">✗</text><text x="80" y="265" class="item">重排（reflow）开销大</text>
  <text x="60" y="285" class="cross">✗</text><text x="80" y="285" class="item">重绘（repaint）影响性能</text>
  <text x="60" y="305" class="cross">✗</text><text x="80" y="305" class="item">频繁更新会卡顿（60Hz 下 16ms 限制）</text>

  <text x="60" y="340" class="item" style="font-weight: 700;">API</text>
  <text x="60" y="360" class="item">DOM API（querySelector、appendChild）</text>
  <text x="60" y="378" class="item" style="font-size: 13px;">直接操作浏览器渲染树</text>

  <text x="60" y="410" class="item" style="font-weight: 700;">示例</text>
  <text x="60" y="430" class="code">document.querySelector('.list')</text>
  <text x="60" y="448" class="code">  .appendChild(newDiv)  // 直接改 DOM</text>

  <rect x="460" y="100" width="380" height="380" class="col-success" rx="8"/>
  <text x="650" y="135" class="col-title">Virtual DOM（虚拟 DOM）</text>

  <text x="480" y="170" class="item" style="font-weight: 700;">本质</text>
  <text x="480" y="190" class="item">用 JS 对象描述 DOM 树</text>
  <text x="480" y="210" class="code">{ type: 'div', props: { ... }, children: [...] }</text>

  <text x="480" y="245" class="item" style="font-weight: 700;">操作成本</text>
  <text x="480" y="265" class="check">✓</text><text x="500" y="265" class="item">JS 对象操作，零浏览器开销</text>
  <text x="480" y="285" class="check">✓</text><text x="500" y="285" class="item">批量收集变化，最后统一更新</text>
  <text x="480" y="305" class="check">✓</text><text x="500" y="305" class="item">diff 算法减少 DOM 操作次数</text>

  <text x="480" y="340" class="item" style="font-weight: 700;">API</text>
  <text x="480" y="360" class="item">React 组件渲染生成</text>
  <text x="480" y="378" class="item" style="font-size: 13px;">通过 reconcile 算法更新</text>

  <text x="480" y="410" class="item" style="font-weight: 700;">示例</text>
  <text x="480" y="430" class="code">React.createElement('div', null, 'hi')</text>
  <text x="480" y="448" class="code">// React 内部 diff → patch 到真实 DOM</text>
</svg>