<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 1003 510" width="1003" height="510"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="-140" y="0" width="1003" height="510" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-danger: #ef4444; --c-danger-soft: #fee2e2; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-danger: #f87171; --c-danger-soft: #7f1d1d; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .node-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .node-key { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .node-keep { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5; }
    .node-move { fill: var(--c-danger-soft); stroke: var(--c-danger); stroke-width: 1.5; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .label { font-size: 13px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); text-anchor: middle; }
    .section-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
    .item { font-size: 13px; fill: var(--c-text); }
  </style>
  <defs>
    <marker id="ax-r4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">React Diff 三层策略 + key 的优化</text>
  <text x="40" y="62" class="subtitle">Tree diff / Component diff / Element diff</text>

  <rect x="40" y="100" width="800" height="100" class="node-box" rx="6"/>
  <text x="60" y="125" class="section-title">① Tree diff（树对比）</text>
  <text x="60" y="148" class="item">• 同层比较，不跨级（O(n) 而非 O(n³)）</text>
  <text x="60" y="168" class="item">• 节点跨层移动 → 直接删除重建（不优化跨级移动）</text>
  <text x="60" y="188" class="code">React 假设 Web UI 很少跨级移动，所以放弃最优解换性能</text>

  <rect x="40" y="215" width="800" height="80" class="node-box" rx="6"/>
  <text x="60" y="240" class="section-title">② Component diff（组件对比）</text>
  <text x="60" y="263" class="item">• 同类型组件：继续按 Tree diff 对比（节省性能）</text>
  <text x="60" y="283" class="item">• 不同类型组件：直接删除旧组件 + 创建新组件（不递归对比）</text>

  <text x="60" y="330" class="section-title">③ Element diff + key 的作用（核心）</text>

  <g>
    <text x="60" y="365" class="item">旧（无 key）：</text>
    <rect x="135" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="155" y="370" class="label">A</text>
    <rect x="180" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="200" y="370" class="label">B</text>
    <rect x="225" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="245" y="370" class="label">C</text>

    <text x="290" y="370" class="item">→</text>

    <text x="315" y="365" class="item">新（无 key）：</text>
    <rect x="390" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="410" y="370" class="label">X</text>
    <rect x="435" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="455" y="370" class="label">A</text>
    <rect x="480" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="500" y="370" class="label">B</text>
    <rect x="525" y="350" width="40" height="32" class="node-move" rx="3"/>
    <text x="545" y="370" class="label">C</text>

    <text x="60" y="408" class="item" style="fill: var(--c-danger); font-weight: 700;">❌ React 重建 4 个节点（无法判断 ABC 是否相同）</text>
  </g>

  <g>
    <text x="60" y="438" class="item">新（有 key）：</text>
    <rect x="160" y="423" width="40" height="32" class="node-keep" rx="3"/>
    <text x="180" y="443" class="label" style="font-size: 13px;">X</text>
    <rect x="205" y="423" width="40" height="32" class="node-keep" rx="3"/>
    <text x="225" y="443" class="label" style="font-size: 13px;">A</text>
    <rect x="250" y="423" width="40" height="32" class="node-keep" rx="3"/>
    <text x="270" y="443" class="label" style="font-size: 13px;">B</text>
    <rect x="295" y="423" width="40" height="32" class="node-keep" rx="3"/>
    <text x="315" y="443" class="label" style="font-size: 13px;">C</text>

    <text x="370" y="438" class="item" style="fill: var(--c-success); font-weight: 700;">✓ ABC 复用，只新建 X（1 次创建 + 3 次复用）</text>
  </g>

  <text x="40" y="485" class="subtitle">⚠ key 不要用 index（列表增删会变 key），用数据 ID（id / sku）</text>
</svg>