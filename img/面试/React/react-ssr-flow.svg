<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 503" width="880" height="503"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="503" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .stage-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .stage-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .stage-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .arrow-success { stroke: var(--c-success); stroke-width: 2; fill: none; }
    .label { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
    .section-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
    .item { font-size: 13px; fill: var(--c-text); }
    .col-title { font-size: 16px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
  </style>
  <defs>
    <marker id="ax-r8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">React SSR / SSG / CSR 渲染模式</text>
  <text x="40" y="62" class="subtitle">何时用 Server，何时用 Static，框架怎么选</text>

  <rect x="40" y="90" width="260" height="140" class="stage-brand" rx="6"/>
  <text x="170" y="115" class="col-title">SSR（服务端渲染）</text>
  <text x="60" y="140" class="code" text-anchor="start">renderToString(&lt;App /&gt;)</text>
  <text x="60" y="158" class="item" text-anchor="start">• 每次请求动态渲染</text>
  <text x="60" y="178" class="item" text-anchor="start">• SEO 友好</text>
  <text x="60" y="198" class="item" text-anchor="start">• 首屏快（HTML 含内容）</text>
  <text x="60" y="218" class="item" text-anchor="start">⚠ 服务器压力大</text>

  <rect x="320" y="90" width="260" height="140" class="stage-success" rx="6"/>
  <text x="450" y="115" class="col-title">SSG（静态生成）</text>
  <text x="340" y="140" class="code" text-anchor="start">getStaticProps()</text>
  <text x="340" y="158" class="item" text-anchor="start">• 构建时生成 HTML</text>
  <text x="340" y="178" class="item" text-anchor="start">• 部署到 CDN</text>
  <text x="340" y="198" class="item" text-anchor="start">• 极快（无需服务器）</text>
  <text x="340" y="218" class="item" text-anchor="start">⚠ 内容变化需重新构建</text>

  <rect x="600" y="90" width="240" height="140" class="stage-box" rx="6"/>
  <text x="720" y="115" class="col-title">CSR（客户端渲染）</text>
  <text x="620" y="140" class="code" text-anchor="start">ReactDOM.render()</text>
  <text x="620" y="158" class="item" text-anchor="start">• SPA 模式</text>
  <text x="620" y="178" class="item" text-anchor="start">• 服务器压力小</text>
  <text x="620" y="198" class="item" text-anchor="start">• 前后端分离</text>
  <text x="620" y="218" class="item" text-anchor="start">⚠ SEO 差 / 首屏慢</text>

  <text x="40" y="265" class="section-title">SSR 完整流程（Next.js）：</text>

  <g>
    <rect x="60" y="290" width="180" height="50" class="stage-box" rx="4"/>
    <text x="150" y="315" class="label">① 请求到达</text>
    <text x="150" y="332" class="code" text-anchor="middle">Next.js 服务器</text>
  </g>
  <line x1="240" y1="315" x2="270" y2="315" class="arrow" marker-end="url(#ax-r8)"/>

  <g>
    <rect x="270" y="290" width="180" height="50" class="stage-brand" rx="4"/>
    <text x="360" y="315" class="label">② ReactDOMServer</text>
    <text x="360" y="332" class="code" text-anchor="middle">renderToString(&lt;App /&gt;)</text>
  </g>
  <line x1="450" y1="315" x2="480" y2="315" class="arrow" marker-end="url(#ax-r8)"/>

  <g>
    <rect x="480" y="290" width="180" height="50" class="stage-success" rx="4"/>
    <text x="570" y="315" class="label">③ 注入数据</text>
    <text x="570" y="332" class="code" text-anchor="middle">window.__INITIAL_DATA__</text>
  </g>
  <line x1="660" y1="315" x2="690" y2="315" class="arrow-success" marker-end="url(#ax-r8)"/>

  <g>
    <rect x="690" y="290" width="150" height="50" class="stage-success" rx="4"/>
    <text x="765" y="315" class="label">④ 浏览器</text>
    <text x="765" y="332" class="code" text-anchor="middle">hydrate 接管</text>
  </g>

  <rect x="40" y="360" width="800" height="120" style="fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1.5;" rx="6"/>
  <text x="60" y="385" class="section-title" style="fill: var(--c-warning);">⚠ SSR 坑</text>
  <text x="60" y="408" class="item">• window / document 服务端没有</text>
  <text x="60" y="428" class="item">• 不一致警告（hydration mismatch）</text>
  <text x="60" y="448" class="item">• 解决方案：动态 import / useEffect / 客户端守卫</text>
  <text x="60" y="468" class="item">⚡ Next.js 14+ App Router 默认 RSC（React Server Components）</text>
</svg>