<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root { --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .stage-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .stage-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .stage-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .stage-warning { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 2; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .label { font-size: 12px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .sub { font-size: 10px; fill: var(--c-text-soft); text-anchor: middle; }
    .col-title { font-size: 16px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
  </style>
  <defs>
    <marker id="ax-r5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">React 生命周期（旧 vs 新）</text>
  <text x="40" y="62" class="subtitle">React 16.3+ 弃用旧生命周期，推荐使用 Hooks</text>

  <rect x="40" y="90" width="400" height="420" class="stage-warning" rx="6"/>
  <text x="240" y="118" class="col-title" style="fill: var(--c-warning);">旧版（class component）</text>

  <g>
    <rect x="60" y="140" width="160" height="36" class="stage-brand" rx="4"/>
    <text x="140" y="160" class="label">constructor</text>
  </g>
  <line x1="140" y1="176" x2="140" y2="195" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="60" y="200" width="160" height="36" class="stage-brand" rx="4"/>
    <text x="140" y="220" class="label">componentWillMount</text>
    <text x="140" y="232" class="sub">（已弃用）</text>
  </g>
  <line x1="140" y1="236" x2="140" y2="255" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="60" y="260" width="160" height="36" class="stage-success" rx="4"/>
    <text x="140" y="280" class="label">render</text>
  </g>
  <line x1="140" y1="296" x2="140" y2="315" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="60" y="320" width="160" height="36" class="stage-success" rx="4"/>
    <text x="140" y="340" class="label">componentDidMount</text>
  </g>

  <g>
    <rect x="240" y="140" width="180" height="36" class="stage-warning" rx="4"/>
    <text x="330" y="160" class="label">componentWillReceiveProps</text>
    <text x="330" y="172" class="sub">（已弃用）</text>
  </g>
  <line x1="330" y1="176" x2="330" y2="195" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="240" y="200" width="180" height="36" class="stage-warning" rx="4"/>
    <text x="330" y="220" class="label">shouldComponentUpdate</text>
    <text x="330" y="232" class="sub">（性能优化点）</text>
  </g>
  <line x1="330" y1="236" x2="330" y2="255" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="240" y="260" width="180" height="36" class="stage-warning" rx="4"/>
    <text x="330" y="280" class="label">componentWillUpdate</text>
    <text x="330" y="292" class="sub">（已弃用）</text>
  </g>
  <line x1="330" y1="296" x2="330" y2="315" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="240" y="320" width="180" height="36" class="stage-success" rx="4"/>
    <text x="330" y="340" class="label">componentDidUpdate</text>
  </g>

  <line x1="240" y1="360" x2="240" y2="395" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="60" y="400" width="360" height="36" class="stage-brand" rx="4"/>
    <text x="240" y="420" class="label">componentWillUnmount</text>
    <text x="240" y="432" class="sub">清理副作用</text>
  </g>

  <rect x="460" y="90" width="380" height="420" class="stage-success" rx="6"/>
  <text x="650" y="118" class="col-title" style="fill: var(--c-success);">新版（function + Hooks）</text>

  <g>
    <rect x="480" y="140" width="160" height="36" class="stage-brand" rx="4"/>
    <text x="560" y="160" class="label">函数体</text>
    <text x="560" y="172" class="sub">（替代 class）</text>
  </g>
  <line x1="560" y1="176" x2="560" y2="195" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="480" y="200" width="160" height="36" class="stage-success" rx="4"/>
    <text x="560" y="220" class="label">useState</text>
    <text x="560" y="232" class="sub">替代 state</text>
  </g>
  <line x1="560" y1="236" x2="560" y2="255" class="arrow" marker-end="url(#ax-r5)"/>
  <g>
    <rect x="480" y="260" width="160" height="36" class="stage-success" rx="4"/>
    <text x="560" y="280" class="label">return JSX</text>
    <text x="560" y="292" class="sub">render</text>
  </g>

  <g>
    <rect x="660" y="140" width="160" height="36" class="stage-success" rx="4"/>
    <text x="740" y="160" class="label">useEffect</text>
    <text x="740" y="172" class="sub">mount + update</text>
  </g>
  <g>
    <rect x="660" y="200" width="160" height="36" class="stage-success" rx="4"/>
    <text x="740" y="220" class="label">useLayoutEffect</text>
    <text x="740" y="232" class="sub">同步执行</text>
  </g>
  <g>
    <rect x="660" y="260" width="160" height="36" class="stage-success" rx="4"/>
    <text x="740" y="280" class="label">useMemo / useCallback</text>
    <text x="740" y="292" class="sub">shouldComponentUpdate</text>
  </g>

  <g>
    <rect x="660" y="320" width="160" height="36" class="stage-success" rx="4"/>
    <text x="740" y="340" class="label">useEffect cleanup</text>
    <text x="740" y="352" class="sub">unmount</text>
  </g>

  <text x="40" y="475" class="subtitle">⚡ 新版优势：逻辑组合复用、tree-shaking、bundle 更小、class this 烦恼消失</text>
  <text x="40" y="497" class="subtitle">⚠ React 18+：useEffect 在 commit 后异步执行；useLayoutEffect 同步</text>
</svg>