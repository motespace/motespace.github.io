<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root { --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .stage-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .stage-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .stage-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .stage-title { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .stage-text { font-size: 11px; fill: var(--c-text); text-anchor: middle; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 11px; fill: var(--c-text); text-anchor: middle; }
    .center-bg { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
  </style>
  <defs>
    <marker id="ax-v4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Vue 渲染流程（数据变化 → DOM 更新）</text>
  <text x="40" y="62" class="subtitle">响应式数据 → 依赖收集 → render → patch → 真实 DOM</text>

  <g>
    <rect x="40" y="100" width="160" height="70" class="stage-box" rx="6"/>
    <text x="120" y="125" class="stage-title">数据变化</text>
    <text x="120" y="148" class="code">this.msg = 'hi'</text>
    <text x="120" y="163" class="stage-text">触发 setter</text>
  </g>

  <line x1="200" y1="135" x2="240" y2="135" class="arrow" marker-end="url(#ax-v4)"/>

  <g>
    <rect x="240" y="100" width="160" height="70" class="stage-brand" rx="6"/>
    <text x="320" y="125" class="stage-title">依赖通知</text>
    <text x="320" y="148" class="code">dep.notify()</text>
    <text x="320" y="163" class="stage-text">遍历所有 watcher</text>
  </g>

  <line x1="400" y1="135" x2="440" y2="135" class="arrow" marker-end="url(#ax-v4)"/>

  <g>
    <rect x="440" y="100" width="160" height="70" class="stage-brand" rx="6"/>
    <text x="520" y="125" class="stage-title">Watcher 调度</text>
    <text x="520" y="148" class="code">watcher.update()</text>
    <text x="520" y="163" class="stage-text">推入 nextTick 队列</text>
  </g>

  <line x1="600" y1="135" x2="640" y2="135" class="arrow" marker-end="url(#ax-v4)"/>

  <g>
    <rect x="640" y="100" width="200" height="70" class="stage-brand" rx="6"/>
    <text x="740" y="125" class="stage-title">重新 render</text>
    <text x="740" y="148" class="code">render() → newVnode</text>
    <text x="740" y="163" class="stage-text">生成虚拟 DOM</text>
  </g>

  <line x1="740" y1="170" x2="740" y2="200" class="arrow" marker-end="url(#ax-v4)"/>

  <g>
    <rect x="40" y="200" width="800" height="100" class="center-bg" rx="6"/>
    <text x="440" y="225" class="stage-title">patch(oldVnode, newVnode)</text>
    <text x="440" y="248" class="stage-text" style="font-size: 13px;">Vue Diff：同层比较 + 双端对比</text>
    <text x="440" y="270" class="code">sameVnode → patchVnode → updateChildren</text>
    <text x="440" y="290" class="stage-text" style="font-size: 11px;">⚡ 最小化 DOM 操作（只更新变化的部分）</text>
  </g>

  <line x1="440" y1="300" x2="440" y2="335" class="arrow" marker-end="url(#ax-v4)"/>

  <g>
    <rect x="40" y="335" width="800" height="120" class="stage-success" rx="6"/>
    <text x="440" y="365" class="stage-title" style="fill: var(--c-success);">真实 DOM 更新完成</text>
    <text x="440" y="390" class="stage-text" style="font-size: 13px;">异步批处理：同一事件循环内的多次数据变化合并为一次 render</text>
    <text x="60" y="420" class="stage-text" text-anchor="start">⚡ 关键：Vue 默认异步更新（nextTick 实现），避免频繁 re-render</text>
    <text x="60" y="440" class="stage-text" text-anchor="start">⚡ 组件级更新：子组件 props 变化触发子组件重渲染</text>
  </g>
</svg>