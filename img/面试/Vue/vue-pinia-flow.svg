<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 537" width="880" height="537"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="537" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .store-box { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .item-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .item-title { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .item-text { font-size: 13px; fill: var(--c-text-soft); text-anchor: middle; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
    .section-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
  </style>
  <defs>
    <marker id="ax-v8" viewBox="0 0 10 10" viewCut="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Pinia 数据流（Vue 官方推荐状态管理）</text>
  <text x="40" y="62" class="subtitle">扁平化 store + Composition API，无 mutations</text>

  <rect x="60" y="100" width="120" height="80" class="item-box" rx="6"/>
  <text x="120" y="125" class="item-title">组件 A</text>
  <text x="120" y="148" class="code">const { count }</text>
  <text x="120" y="163" class="code">= storeToRefs(useStore)</text>

  <rect x="380" y="100" width="120" height="80" class="item-box" rx="6"/>
  <text x="440" y="125" class="item-title">组件 B</text>
  <text x="440" y="148" class="code">store.count++</text>
  <text x="440" y="163" class="code">（直接修改）</text>

  <line x1="180" y1="140" x2="375" y2="140" class="arrow" marker-end="url(#ax-v8)"/>

  <rect x="240" y="240" width="400" height="200" class="store-box" rx="8"/>
  <text x="440" y="270" class="item-title" style="font-size: 16px;">Pinia Store</text>

  <rect x="260" y="290" width="170" height="50" class="item-box" rx="4"/>
  <text x="345" y="310" class="item-title" style="fill: var(--c-brand);">state</text>
  <text x="345" y="328" class="code">count: 0</text>

  <rect x="450" y="290" width="170" height="50" class="item-box" rx="4"/>
  <text x="535" y="310" class="item-title" style="fill: var(--c-brand);">getters</text>
  <text x="535" y="328" class="code">double: () =&gt; count*2</text>

  <rect x="260" y="350" width="170" height="50" class="item-box" rx="4"/>
  <text x="345" y="370" class="item-title" style="fill: var(--c-brand);">actions</text>
  <text x="345" y="388" class="code">increment()</text>

  <rect x="450" y="350" width="170" height="50" class="item-box" rx="4"/>
  <text x="535" y="370" class="item-title" style="fill: var(--c-brand);">plugins</text>
  <text x="535" y="388" class="code">persistence</text>

  <line x1="440" y1="180" x2="440" y2="240" class="arrow" marker-end="url(#ax-v8)"/>

  <text x="40" y="475" class="section-title">vs Vuex：</text>
  <text x="60" y="495" class="item">✓ 无 mutations（直接修改 state）</text>
  <text x="60" y="513" class="item">✓ 无 modules 嵌套（自动扁平化）</text>
  <text x="420" y="495" class="item">✓ TS 友好（自动推导类型）</text>
  <text x="420" y="513" class="item">✓ DevTools 支持（store 标签）</text>
</svg>