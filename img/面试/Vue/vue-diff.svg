<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="500" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .node { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .node-match { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5; }
    .node-key { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .node-move { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1.5; }
    .node-label { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .node-sub { font-size: 13px; fill: var(--c-text-soft); text-anchor: middle; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .arrow-success { stroke: var(--c-success); stroke-width: 2; fill: none; }
    .arrow-warning { stroke: var(--c-warning); stroke-width: 2; fill: none; }
    .section-title { font-size: 14px; font-weight: 700; fill: var(--c-text); }
    .item-text { font-size: 13px; fill: var(--c-text); }
  </style>
  <defs>
    <marker id="ax-v6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
    <marker id="ax-v6-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-success)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Vue Diff 算法（同层 + 双端 + key）</text>
  <text x="40" y="62" class="subtitle">O(n) 复杂度，key 优化减少 DOM 移动</text>

  <text x="60" y="105" class="section-title">同层比较（核心原则）</text>
  <text x="60" y="125" class="item-text">Vue 2 / Vue 3 都只比较同层级节点，不跨级。时间复杂度 O(n)。</text>

  <g>
    <text x="60" y="170" class="section-title">示例：key 的作用</text>
    <text x="60" y="190" class="item-text" style="font-size: 13px; fill: var(--c-text-soft);">原始：</text>
    <text x="60" y="210" class="item-text">A B C D E → 改为 A B F D E（无 key，diff 会重建多个）</text>
  </g>

  <g>
    <text x="60" y="245" class="section-title" style="fill: var(--c-success);">✓ 用 key（推荐）</text>

    <text x="60" y="270" class="item-text" style="font-size: 13px;">旧：</text>
    <g>
      <rect x="100" y="280" width="40" height="32" class="node-key" rx="4"/>
      <text x="120" y="300" class="node-label">A</text>

      <rect x="145" y="280" width="40" height="32" class="node-key" rx="4"/>
      <text x="165" y="300" class="node-label">B</text>

      <rect x="190" y="280" width="40" height="32" class="node-key" rx="4"/>
      <text x="210" y="300" class="node-label">C</text>

      <rect x="235" y="280" width="40" height="32" class="node-key" rx="4"/>
      <text x="255" y="300" class="node-label">D</text>

      <rect x="280" y="280" width="40" height="32" class="node-key" rx="4"/>
      <text x="300" y="300" class="node-label">E</text>
    </g>

    <text x="60" y="335" class="item-text" style="font-size: 13px;">新：</text>
    <g>
      <rect x="100" y="345" width="40" height="32" class="node-match" rx="4"/>
      <text x="120" y="365" class="node-label">A</text>

      <rect x="145" y="345" width="40" height="32" class="node-match" rx="4"/>
      <text x="165" y="365" class="node-label">B</text>

      <rect x="190" y="345" width="40" height="32" class="node-move" rx="4"/>
      <text x="210" y="365" class="node-label">F</text>

      <rect x="235" y="345" width="40" height="32" class="node-match" rx="4"/>
      <text x="255" y="365" class="node-label">D</text>

      <rect x="280" y="345" width="40" height="32" class="node-match" rx="4"/>
      <text x="300" y="365" class="node-label">E</text>
    </g>

    <text x="340" y="405" class="item-text">只需移动 C → F</text>
    <text x="340" y="425" class="item-text" style="fill: var(--c-success); font-weight: 700;">DOM 操作：1 次移动</text>
  </g>

  <text x="60" y="455" class="section-title" style="fill: var(--c-brand);">Vue 3 改进：</text>
  <text x="60" y="475" class="item-text">• 使用最长递增子序列算法（最长上升子序列），进一步减少 DOM 移动</text>
</svg>