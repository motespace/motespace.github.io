<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root { --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; --c-danger: #ef4444; --c-danger-soft: #fee2e2; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; --c-danger: #f87171; --c-danger-soft: #7f1d1d; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .cache-box { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5; }
    .component-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .keepalive-box { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .arrow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .arrow-success { stroke: var(--c-success); stroke-width: 2; fill: none; }
    .arrow-danger { stroke: var(--c-danger); stroke-width: 2; fill: none; }
    .label { font-size: 13px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
    .code { font-family: Consolas, Monaco, monospace; font-size: 11px; fill: var(--c-text); }
    .item-text { font-size: 12px; fill: var(--c-text); }
  </style>
  <defs>
    <marker id="ax-v9-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="ax-v9-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">keep-alive 缓存机制（Vue 内置组件）</text>
  <text x="40" y="62" class="subtitle">组件切换时缓存 DOM 而不销毁，切回时直接复用</text>

  <rect x="320" y="100" width="240" height="80" class="keepalive-box" rx="6"/>
  <text x="440" y="125" class="label">&lt;keep-alive&gt;</text>
  <text x="440" y="148" class="code" text-anchor="middle">&lt;component :is="view" /&gt;</text>

  <rect x="320" y="220" width="240" height="100" class="cache-box" rx="6"/>
  <text x="440" y="245" class="label" style="fill: var(--c-success);">组件实例缓存池</text>

  <rect x="340" y="260" width="90" height="40" class="component-box" rx="3"/>
  <text x="385" y="280" class="label" style="font-size: 12px;">Home</text>
  <text x="385" y="293" class="code" text-anchor="middle" style="font-size: 10px;">缓存中</text>

  <rect x="445" y="260" width="90" height="40" class="component-box" rx="3"/>
  <text x="490" y="280" class="label" style="font-size: 12px;">About</text>
  <text x="490" y="293" class="code" text-anchor="middle" style="font-size: 10px;">缓存中</text>

  <rect x="40" y="350" width="800" height="130" style="fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1.5;" rx="6"/>
  <text x="60" y="378" class="label" text-anchor="start" style="fill: var(--c-warning);">✓ 缓存机制</text>
  <text x="60" y="402" class="item-text" text-anchor="start">• 组件首次挂载：正常执行 setup / onMounted</text>
  <text x="60" y="422" class="item-text" text-anchor="start">• 组件切换走：触发 onDeactivated，DOM 保留在内存</text>
  <text x="60" y="442" class="item-text" text-anchor="start">• 组件再次激活：触发 onActivated，直接复用 DOM（不重新挂载）</text>
  <text x="60" y="462" class="item-text" text-anchor="start">• 离开时：onUnmounted 不会触发</text>

  <text x="40" y="495" class="subtitle">⚠ 适合场景：tab 切换 / 多步骤表单 / 后退缓存（不重新请求数据）</text>
</svg>