<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root {
      --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
      --c-warning: #f59e0b; --c-warning-soft: #fffbeb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
        --c-warning: #fbbf24; --c-warning-soft: #451a03;
      }
    }
    .title { fill: var(--c-text); font-size: 20px; font-weight: 700; }
    .subtitle { fill: var(--c-text-soft); font-size: 13px; }
    .label { fill: var(--c-text); font-size: 13px; font-weight: 600; }
    .label-soft { fill: var(--c-text-soft); font-size: 12px; }
    .code { font-family: 'SFMono-Regular', Consolas, monospace; fill: var(--c-text); font-size: 12px; }
    .host { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 2; }
    .bridge { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .container { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5; }
    .veth { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1.5; }
    .line { stroke: var(--c-border); stroke-width: 1; fill: none; }
  </style>

  <text x="40" y="40" class="title">bridge 网络拓扑</text>
  <text x="40" y="62" class="subtitle">自定义网络下容器用服务名互访,底层走 veth pair</text>

  <rect x="40" y="90" width="800" height="380" rx="8" class="host"/>
  <text x="60" y="115" class="label">Docker Host (宿主机)</text>

  <text x="60" y="135" class="label-soft">物理网卡 eth0</text>
  <rect x="60" y="140" width="120" height="20" rx="2" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text x="120" y="156" class="code" text-anchor="middle">eth0: 192.168.1.10</text>

  <rect x="280" y="180" width="500" height="220" rx="6" class="bridge"/>
  <text x="530" y="205" class="label" text-anchor="middle">docker0 / mynet (bridge)</text>
  <text x="530" y="225" class="code" text-anchor="middle">172.17.0.1 / 172.18.0.1</text>

  <rect x="300" y="250" width="120" height="50" rx="4" class="veth"/>
  <text x="360" y="270" class="code" text-anchor="middle">veth-abc123</text>
  <text x="360" y="288" class="label-soft" text-anchor="middle">172.18.0.2</text>

  <rect x="300" y="330" width="120" height="50" rx="4" class="container"/>
  <text x="360" y="350" class="label" text-anchor="middle">容器 web</text>
  <text x="360" y="368" class="code" text-anchor="middle">nginx: 80</text>

  <rect x="460" y="250" width="120" height="50" rx="4" class="veth"/>
  <text x="520" y="270" class="code" text-anchor="middle">veth-def456</text>
  <text x="520" y="288" class="label-soft" text-anchor="middle">172.18.0.3</text>

  <rect x="460" y="330" width="120" height="50" rx="4" class="container"/>
  <text x="520" y="350" class="label" text-anchor="middle">容器 api</text>
  <text x="520" y="368" class="code" text-anchor="middle">node: 3000</text>

  <rect x="620" y="250" width="120" height="50" rx="4" class="veth"/>
  <text x="680" y="270" class="code" text-anchor="middle">veth-ghi789</text>
  <text x="680" y="288" class="label-soft" text-anchor="middle">172.18.0.4</text>

  <rect x="620" y="330" width="120" height="50" rx="4" class="container"/>
  <text x="680" y="350" class="label" text-anchor="middle">容器 db</text>
  <text x="680" y="368" class="code" text-anchor="middle">mysql: 3306</text>

  <line x1="360" y1="300" x2="360" y2="328" class="line"/>
  <line x1="520" y1="300" x2="520" y2="328" class="line"/>
  <line x1="680" y1="300" x2="680" y2="328" class="line"/>

  <line x1="180" y1="150" x2="280" y2="200" class="line"/>

  <text x="40" y="475" class="label-soft">关键:同一 bridge 内,容器用服务名互访(web → api:3000 自动 DNS 解析为 172.18.0.3)</text>
</svg>