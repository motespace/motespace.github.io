<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 627" width="880" height="627"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="627" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
      --c-warning: #f59e0b; --c-warning-soft: #fffbeb;
      --c-danger: #ef4444; --c-danger-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
        --c-warning: #fbbf24; --c-warning-soft: #451a03;
        --c-danger: #f87171; --c-danger-soft: #7f1d1d;
      }
    }
    .title { fill: var(--c-text); font-size: 20px; font-weight: 700; }
    .subtitle { fill: var(--c-text-soft); font-size: 13px; }
    .label { fill: var(--c-text); font-size: 13px; font-weight: 600; }
    .label-soft { fill: var(--c-text-soft); font-size: 13px; }
    .code { font-family: 'SFMono-Regular', Consolas, monospace; fill: var(--c-text); font-size: 13px; }
    .user { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 2; }
    .nginx { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 2; }
    .app { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 2; }
    .db { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 2; }
    .monitor { fill: var(--c-danger-soft); stroke: var(--c-danger); stroke-width: 2; }
    .line { stroke: var(--c-border); stroke-width: 1; fill: none; }
    .line-arrow { stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="pa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-brand)"/>
    </marker>
    <marker id="pa-arrow-monitor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-danger)"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">生产部署整体架构</text>
  <text x="40" y="62" class="subtitle">主链路 + 监控告警两个维度</text>

  <text x="40" y="100" class="label">主链路</text>

  <rect x="40" y="120" width="120" height="80" rx="8" class="user"/>
  <text x="100" y="150" class="label" text-anchor="middle">用户</text>
  <text x="100" y="168" class="label-soft" text-anchor="middle">浏览器 / App</text>
  <text x="100" y="184" class="code" text-anchor="middle">HTTPS</text>

  <rect x="220" y="120" width="180" height="80" rx="8" class="nginx"/>
  <text x="310" y="150" class="label" text-anchor="middle">Nginx</text>
  <text x="310" y="168" class="label-soft" text-anchor="middle">反向代理 + HTTPS 终止</text>
  <text x="310" y="186" class="code" text-anchor="middle">:80 / :443</text>

  <rect x="460" y="120" width="180" height="80" rx="8" class="app"/>
  <text x="550" y="150" class="label" text-anchor="middle">应用服务</text>
  <text x="550" y="168" class="label-soft" text-anchor="middle">Node.js / Python</text>
  <text x="550" y="186" class="code" text-anchor="middle">systemd · :3000</text>

  <rect x="700" y="120" width="140" height="80" rx="8" class="db"/>
  <text x="770" y="150" class="label" text-anchor="middle">MySQL</text>
  <text x="770" y="168" class="label-soft" text-anchor="middle">持久化</text>
  <text x="770" y="186" class="code" text-anchor="middle">:3306</text>

  <line x1="160" y1="160" x2="218" y2="160" class="line-arrow" stroke="var(--c-brand)" marker-end="url(#pa-arrow)"/>
  <line x1="400" y1="160" x2="458" y2="160" class="line-arrow" stroke="var(--c-brand)" marker-end="url(#pa-arrow)"/>
  <line x1="640" y1="160" x2="698" y2="160" class="line-arrow" stroke="var(--c-brand)" marker-end="url(#pa-arrow)"/>

  <text x="40" y="280" class="label">监控告警</text>

  <rect x="40" y="310" width="120" height="60" rx="6" fill="none" stroke="var(--c-border)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="335" class="label-soft" text-anchor="middle">node_exporter</text>
  <text x="100" y="353" class="label-soft" text-anchor="middle">:9100</text>

  <rect x="40" y="380" width="120" height="60" rx="6" fill="none" stroke="var(--c-border)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="405" class="label-soft" text-anchor="middle">mysqld_exporter</text>
  <text x="100" y="423" class="label-soft" text-anchor="middle">:9104</text>

  <rect x="40" y="450" width="120" height="60" rx="6" fill="none" stroke="var(--c-border)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="475" class="label-soft" text-anchor="middle">app /metrics</text>
  <text x="100" y="493" class="label-soft" text-anchor="middle">:3000/metrics</text>

  <rect x="280" y="320" width="200" height="190" rx="8" class="monitor"/>
  <text x="380" y="350" class="label" text-anchor="middle">Prometheus</text>
  <text x="380" y="370" class="code" text-anchor="middle">主动 pull · 15s</text>
  <text x="380" y="390" class="label-soft" text-anchor="middle">PromQL · 记录规则</text>
  <text x="380" y="408" class="label-soft" text-anchor="middle">告警规则(alert rules)</text>

  <rect x="540" y="320" width="140" height="80" rx="6" fill="none" stroke="var(--c-success)" stroke-width="2"/>
  <text x="610" y="348" class="label" text-anchor="middle">Grafana</text>
  <text x="610" y="366" class="label-soft" text-anchor="middle">可视化</text>
  <text x="610" y="384" class="code" text-anchor="middle">Dashboard</text>

  <rect x="540" y="420" width="140" height="90" rx="6" fill="none" stroke="var(--c-danger)" stroke-width="2"/>
  <text x="610" y="448" class="label" text-anchor="middle">Alertmanager</text>
  <text x="610" y="466" class="label-soft" text-anchor="middle">告警去重 / 分组</text>
  <text x="610" y="484" class="label-soft" text-anchor="middle">→ 钉钉 / 邮件</text>
  <text x="610" y="502" class="code" text-anchor="middle">值班 oncall</text>

  <rect x="740" y="420" width="100" height="90" rx="6" fill="none" stroke="var(--c-border)" stroke-width="1"/>
  <text x="790" y="448" class="label" text-anchor="middle">通知</text>
  <text x="790" y="468" class="label-soft" text-anchor="middle">钉钉群</text>
  <text x="790" y="486" class="label-soft" text-anchor="middle">@oncall</text>
  <text x="790" y="502" class="label-soft" text-anchor="middle">短信 / 电话</text>

  <line x1="160" y1="340" x2="278" y2="370" class="line-arrow" stroke="var(--c-danger)" marker-end="url(#pa-arrow-monitor)"/>
  <line x1="160" y1="410" x2="278" y2="410" class="line-arrow" stroke="var(--c-danger)" marker-end="url(#pa-arrow-monitor)"/>
  <line x1="160" y1="480" x2="278" y2="450" class="line-arrow" stroke="var(--c-danger)" marker-end="url(#pa-arrow-monitor)"/>

  <line x1="480" y1="370" x2="538" y2="360" class="line-arrow" stroke="var(--c-brand)" marker-end="url(#pa-arrow)"/>
  <line x1="480" y1="430" x2="538" y2="460" class="line-arrow" stroke="var(--c-brand)" marker-end="url(#pa-arrow)"/>

  <line x1="680" y1="465" x2="738" y2="465" class="line-arrow" stroke="var(--c-danger)" marker-end="url(#pa-arrow-monitor)"/>

  <text x="40" y="565" class="label-soft">要点:</text>
  <text x="40" y="585" class="label-soft">· 主链路:用户 → Nginx(SSL) → 应用 → DB,所有内部走 HTTP/private network</text>
  <text x="40" y="602" class="label-soft">· 监控独立维度:exporters 暴露指标,Prometheus 抓,Grafana 看,Alertmanager 通知</text>
</svg>