<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<style>
:root { --c-text: #1f2937; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-success: #10b981; --c-success-soft: #d1fae5; --c-warning: #f59e0b; --c-warning-soft: #fffbeb; }
@media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-success: #34d399; --c-success-soft: #064e3b; --c-warning: #fbbf24; --c-warning-soft: #451a03; } }
.title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
.subtitle { font-size: 14px; fill: var(--c-text-soft); }
.lane-bg { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
.lifeline { stroke: var(--c-border); stroke-width: 1.5; stroke-dasharray: 4 4; }
.lane-label { font-size: 14px; font-weight: 700; fill: var(--c-text); text-anchor: middle; }
.msg-line { stroke-width: 1.8; fill: none; }
.msg-brand { stroke: var(--c-brand); }
.msg-success { stroke: var(--c-success); }
.msg-warning { stroke: var(--c-warning); }
.msg-label { font-size: 13px; fill: var(--c-text); }
.msg-label-bg { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 0.5; }
.step-num { font-size: 15px; font-weight: 700; fill: var(--c-brand); }
.step-text { font-size: 13px; fill: var(--c-text); }
</style>
<defs>
<marker id="ax-net1-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#3451b2"/>
</marker>
<marker id="ax-net1-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
</marker>
<marker id="ax-net1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
</marker>
</defs>
<text x="40" y="40" class="title">TLS 1.3 握手流程（1-RTT）</text>
<text x="40" y="62" class="subtitle">相比 TLS 1.2 的 2-RTT 减半，更安全更快</text>
<rect x="40" y="90" width="380" height="350" class="lane-bg" rx="6"/>
<text x="230" y="115" class="lane-label">客户端</text>
<rect x="460" y="90" width="380" height="350" class="lane-bg" rx="6"/>
<text x="650" y="115" class="lane-label">服务端</text>
<line x1="230" y1="130" x2="230" y2="430" class="lifeline"/>
<line x1="650" y1="130" x2="650" y2="430" class="lifeline"/>
<g>
<text x="55" y="155" class="step-num">①</text>
<text x="80" y="155" class="step-text">ClientHello + Key Share</text>
<line x1="230" y1="165" x2="640" y2="165" class="msg-line msg-brand" marker-end="url(#ax-net1-b)"/>
<rect x="265" y="150" width="350" height="22" class="msg-label-bg" rx="3"/>
<text x="275" y="165" class="msg-label">ClientHello（协议版本、加密套件、客户端公钥）</text>
</g>
<g>
<text x="55" y="205" class="step-num">②</text>
<text x="80" y="205" class="step-text">服务端响应</text>
<line x1="640" y1="215" x2="240" y2="215" class="msg-line msg-success" marker-end="url(#ax-net1-s)"/>
<rect x="265" y="200" width="350" height="22" class="msg-label-bg" rx="3"/>
<text x="275" y="215" class="msg-label">ServerHello + EncryptedExtensions + Cert + Verify + Finished</text>
</g>
<g>
<text x="475" y="255" class="step-num">③</text>
<text x="500" y="255" class="step-text">服务端密钥派生</text>
<text x="500" y="273" class="step-text" style="font-size: 11px; fill: var(--c-text-soft);">从客户端公钥计算共享密钥</text>
</g>
<g>
<text x="55" y="320" class="step-num">④</text>
<text x="80" y="320" class="step-text">客户端 Finished</text>
<line x1="230" y1="330" x2="640" y2="330" class="msg-line msg-warning" marker-end="url(#ax-net1-w)"/>
<rect x="265" y="315" width="350" height="22" class="msg-label-bg" rx="3"/>
<text x="275" y="330" class="msg-label">Finished（验证握手完整性）</text>
</g>
<g>
<rect x="60" y="370" width="760" height="60" style="fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5;" rx="6"/>
<text x="80" y="395" class="step-text" style="font-weight: 700;">✓ 握手完成</text>
<text x="80" y="418" class="step-text" style="font-size: 12px;">后续 HTTP 请求都在加密通道传输（应用数据）</text>
</g>
<rect x="40" y="455" width="800" height="80" style="fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1;" rx="6"/>
<text x="60" y="478" class="step-text" style="font-weight: 700; fill: var(--c-warning);">⚡ TLS 1.3 主要改进</text>
<text x="60" y="498" class="step-text" style="font-size: 12px;">• 1-RTT（vs TLS 1.2 的 2-RTT）/ 0-RTT 重连模式</text>
<text x="60" y="515" class="step-text" style="font-size: 12px;">• 移除不安全算法（RC4 / MD5 / SHA-1 / 静态 RSA）</text>
<text x="60" y="532" class="step-text" style="font-size: 12px;">• 加密更多握手内容（前向保密）</text>
</svg>