<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="760" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff;
      --c-text-2: #374151;
      --c-text-soft: #6b7280;
      --c-border: #d1d5db;
      --c-bg-soft: #f9fafb;
      --c-brand-soft: #eef2ff;
      --c-brand: #3451b2;
      --c-success: #10b981;
      --c-success-soft: #d1fae5;
      --c-success-text: #065f46;
      --c-warning: #f59e0b;
      --c-warning-soft: #fffbeb;
      --c-warning-2: #d97706;
      --c-warning-text: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff;
        --c-text-2: #d1d5db;
        --c-text-soft: #9ca3af;
        --c-border: #4b5563;
        --c-bg-soft: #1f2937;
        --c-brand-soft: #312e81;
        --c-brand: #818cf8;
        --c-success: #34d399;
        --c-success-soft: #064e3b;
        --c-success-text: #a7f3d0;
        --c-warning: #fbbf24;
        --c-warning-soft: #451a03;
        --c-warning-2: #fbbf24;
        --c-warning-text: #fde68a;
      }
    }

    .title { font-size: 24px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 15px; fill: var(--c-text-soft); }
    .actor { font-size: 20px; font-weight: 700; fill: var(--c-text); }
    .actor-bg { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .lifeline { stroke: var(--c-border); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .msg { stroke: var(--c-brand); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .msg-back { stroke: var(--c-warning); stroke-width: 2; fill: none; marker-end: url(#arrow-w); }
    .msg-label { font-size: 15px; font-weight: 600; fill: var(--c-text); }
    .msg-detail { font-size: 13px; fill: var(--c-text-soft); }
    .phase-tag { font-size: 13px; font-weight: 700; fill: var(--c-on-brand); }
    .phase-1 { fill: var(--c-text-soft); }
    .phase-2 { fill: var(--c-warning-2); }
    .phase-3 { fill: var(--c-success); }
    .phase-bar { fill-opacity: 0.06; }
    .note { font-size: 13px; fill: var(--c-text-2); }
    .key { font-size: 13px; font-weight: 600; fill: var(--c-brand); }
    .info-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .step-cmt { font-size: 13px; fill: var(--c-text-soft); font-style: italic; }

    @keyframes drawIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-step { opacity: 0; animation: drawIn 0.35s ease-out forwards; }
    .msg-step-1 { animation-delay: 0.3s; }
    .msg-step-2 { animation-delay: 0.9s; }
    .msg-step-3 { animation-delay: 1.5s; }
    .msg-step-4 { animation-delay: 2.1s; }
    .msg-step-5 { animation-delay: 2.7s; }
    .msg-step-6 { animation-delay: 3.3s; }
    .msg-step-7 { animation-delay: 3.9s; }
    @media (prefers-reduced-motion: reduce) {
      .msg-step { opacity: 1; animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-brand)"/>
    </marker>
    <marker id="arrow-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-warning)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="40" class="title">HTTPS 完整握手流程(TLS 1.2 + RSA)</text>
  <text x="40" y="60" class="subtitle">TCP 三次握手之后 · 加密通道建立的全过程</text>

  <!-- 阶段背景条 -->
  <rect x="40" y="80" width="800" height="40" rx="4" class="phase-bar" fill="var(--c-text-soft)"/>
  <rect x="40" y="80" width="800" height="40" rx="4" fill="none" stroke="var(--c-border)" stroke-width="0.5"/>
  <text x="60" y="105" class="phase-tag" fill="var(--c-text-soft)">阶段 1 · 协商参数</text>

  <rect x="40" y="125" width="800" height="160" rx="4" class="phase-bar" fill="var(--c-warning-2)"/>
  <rect x="40" y="125" width="800" height="160" rx="4" fill="none" stroke="var(--c-border)" stroke-width="0.5"/>
  <text x="60" y="150" class="phase-tag" fill="var(--c-warning-2)">阶段 2 · 认证 + 密钥交换(非对称)</text>

  <rect x="40" y="290" width="800" height="120" rx="4" class="phase-bar" fill="var(--c-success)"/>
  <rect x="40" y="290" width="800" height="120" rx="4" fill="none" stroke="var(--c-border)" stroke-width="0.5"/>
  <text x="60" y="315" class="phase-tag" fill="var(--c-success)">阶段 3 · 加密通信(对称)</text>

  <!-- 客户端 -->
  <g transform="translate(120, 95)">
    <rect x="-50" y="0" width="100" height="32" rx="16" class="actor-bg"/>
    <text x="0" y="20" class="actor" text-anchor="middle">客户端</text>
  </g>

  <!-- 服务端 -->
  <g transform="translate(720, 95)">
    <rect x="-50" y="0" width="100" height="32" rx="16" class="actor-bg"/>
    <text x="0" y="20" class="actor" text-anchor="middle">服务端</text>
  </g>

  <!-- lifelines -->
  <line x1="120" y1="135" x2="120" y2="430" class="lifeline"/>
  <line x1="720" y1="135" x2="720" y2="430" class="lifeline"/>

  <!-- 第 1 步:Client Hello -->
  <g class="msg-step msg-step-1">
    <line x1="120" y1="160" x2="720" y2="160" class="msg"/>
    <text x="130" y="155" class="msg-label">① Client Hello</text>
    <text x="130" y="170" class="msg-detail">TLS 版本 · 支持的密码套件 · 客户端随机数</text>
    <text x="130" y="184" class="msg-detail">(Server Name · 客户端公钥等扩展)</text>
  </g>

  <!-- 第 2 步:Server Hello + 证书 -->
  <g class="msg-step msg-step-2">
    <line x1="720" y1="220" x2="120" y2="220" class="msg-back"/>
    <text x="130" y="215" class="msg-label">② Server Hello + Certificate + ServerHelloDone</text>
    <text x="130" y="234" class="msg-detail">选定的密码套件 · 服务端随机数 · 服务器证书(含公钥) · ServerHelloDone</text>
  </g>

  <!-- 第 3 步:客户端验证证书 -->
  <g class="msg-step msg-step-3">
    <rect x="60" y="252" width="120" height="24" rx="4" class="info-box"/>
    <text x="120" y="268" class="step-cmt" text-anchor="middle">客户端用 CA 公钥验证证书</text>
  </g>

  <!-- 第 4 步:密钥交换 -->
  <g class="msg-step msg-step-4">
    <line x1="120" y1="305" x2="720" y2="305" class="msg"/>
    <text x="130" y="300" class="msg-label">③ Client Key Exchange · ChangeCipherSpec · Finished</text>
    <text x="130" y="319" class="msg-detail">用服务器公钥加密"预主密钥" · 通知后续用加密 · Finished 验证握手完整性</text>
  </g>

  <!-- 第 5 步:服务端确认 -->
  <g class="msg-step msg-step-5">
    <line x1="720" y1="355" x2="120" y2="355" class="msg-back"/>
    <text x="130" y="350" class="msg-label">④ Server ChangeCipherSpec · Finished</text>
    <text x="130" y="369" class="msg-detail">服务端用私钥解密出预主密钥 · 双方都算出对称密钥 · Finished 验证</text>
  </g>

  <!-- 第 6 步:加密通信开始 -->
  <g class="msg-step msg-step-6">
    <line x1="120" y1="400" x2="720" y2="400" class="msg"/>
    <line x1="720" y1="420" x2="120" y2="420" class="msg"/>
    <text x="130" y="395" class="msg-label">⑤ 加密的 HTTP 通信(对称加密 · AES)</text>
    <text x="130" y="414" class="msg-label" fill="var(--c-success)">⑥ 服务端响应加密数据</text>
  </g>

  <!-- ===== 右侧说明面板 ===== -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="var(--c-brand-soft)" stroke="var(--c-brand)" stroke-width="1"/>
    <text x="20" y="28" class="msg-label" fill="var(--c-brand)">核心思想:非对称加密传密钥,对称加密传数据</text>
    <text x="20" y="50" class="note">· 非对称(RSA / ECDHE)用于握手阶段交换"预主密钥" — 计算昂贵,但只需传一次</text>
    <text x="20" y="66" class="note">· 对称(AES)用于后续所有数据 — 计算快,适合大流量</text>
  </g>

  <g transform="translate(40, 555)">
    <rect x="0" y="0" width="395" height="180" rx="6" class="info-box"/>
    <text x="20" y="26" class="msg-label" fill="var(--c-text)">为什么需要"证书"环节?</text>
    <text x="20" y="50" class="note">· 解决"公钥信任"问题:客户端怎么知道收到的公钥</text>
    <text x="20" y="66" class="note">  是真的属于 example.com,不是中间人伪造的?</text>
    <text x="20" y="86" class="note">· 证书 = CA(证书颁发机构)用其私钥对"服务器公钥"</text>
    <text x="20" y="102" class="note">  做数字签名,客户端用 CA 公钥验证签名</text>
    <text x="20" y="122" class="note">· 浏览器内置了各大 CA 的根证书(公钥),无需用户配置</text>
    <text x="20" y="142" class="note" fill="var(--c-warning-text)">⚠ 自签证书:自己当 CA,只用于内部测试,</text>
    <text x="20" y="158" class="note" fill="var(--c-warning-text)">   浏览器会报警告(ERR_CERT_AUTHORITY_INVALID)</text>
  </g>

  <g transform="translate(445, 555)">
    <rect x="0" y="0" width="395" height="180" rx="6" class="info-box"/>
    <text x="20" y="26" class="msg-label" fill="var(--c-text)">TLS 1.3 的简化(对比 TLS 1.2)</text>
    <text x="20" y="50" class="note">· 1.2 需要 2-RTT(本图就是 2-RTT):</text>
    <text x="20" y="66" class="note">  ClientHello → ServerHello+Cert → ClientKey → Finished</text>
    <text x="20" y="86" class="note">· 1.3 压到 1-RTT:ClientHello 直接带 key share,</text>
    <text x="20" y="102" class="note">  ServerHello+Cert+Finished 一次回完</text>
    <text x="20" y="122" class="note" fill="var(--c-brand)">· 1.3 还支持 0-RTT:首次连接客户端带"早期数据",</text>
    <text x="20" y="138" class="note" fill="var(--c-brand)">  服务端立即处理(适合 GET 请求,防重放)</text>
    <text x="20" y="158" class="note">· 1.3 默认前向保密(PFS):即使长期私钥泄露,</text>
    <text x="20" y="172" class="note">  历史会话也无法解密</text>
  </g>
</svg>
