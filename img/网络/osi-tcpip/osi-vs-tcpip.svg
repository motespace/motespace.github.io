<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 471" width="880" height="471" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="471" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-on-brand: #ffffff;
      --c-text-2: #374151;
      --c-text-soft: #6b7280;
      --c-border: #d1d5db;
      --c-bg-soft: #f9fafb;
      --c-brand-soft: #eef2ff;
      --c-brand: #3451b2;
      --c-slate: #64748b;
      --c-merge-bg: #fef3c7;
      --c-warning: #f59e0b;
      --c-warning-text: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-on-brand: #ffffff;
        --c-text-2: #d1d5db;
        --c-text-soft: #9ca3af;
        --c-border: #4b5563;
        --c-bg-soft: #1f2937;
        --c-brand-soft: #312e81;
        --c-brand: #818cf8;
        --c-slate: #94a3b8;
        --c-merge-bg: #451a03;
        --c-warning: #fbbf24;
        --c-warning-text: #fde68a;
      }
    }

    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 15px; fill: var(--c-text-soft); }
    .col-title { font-size: 16px; font-weight: 700; fill: var(--c-on-brand); }
    .layer-name { font-size: 15px; font-weight: 600; fill: var(--c-text); }
    .layer-en { font-size: 13px; fill: var(--c-text-soft); }
    .arrow { stroke: var(--c-brand); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .left-block { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1; }
    .right-block { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .note { font-size: 13px; fill: var(--c-text-2); font-style: italic; }
    .merge-label { font-size: 13px; fill: var(--c-warning-text); font-weight: 600; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-brand)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="40" class="title">OSI 七层 ↔ TCP/IP 四层 对应关系</text>
  <text x="40" y="62" class="subtitle">OSI 把会话、表示、应用拆开;TCP/IP 合并为一个"应用层"</text>

  <!-- 左列:OSI 七层 -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="360" height="36" rx="6" fill="var(--c-slate)"/>
    <text x="180" y="24" class="col-title" text-anchor="middle">OSI 七层模型</text>

    <rect x="0" y="44" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="64" class="layer-name">7 · 应用层</text>
    <text x="20" y="80" class="layer-en">Application · HTTP / DNS / SMTP</text>

    <rect x="0" y="90" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="110" class="layer-name">6 · 表示层</text>
    <text x="20" y="126" class="layer-en">Presentation · SSL/TLS / JPEG / 加密</text>

    <rect x="0" y="136" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="156" class="layer-name">5 · 会话层</text>
    <text x="20" y="172" class="layer-en">Session · RPC / NetBIOS</text>

    <rect x="0" y="182" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="202" class="layer-name">4 · 传输层</text>
    <text x="20" y="218" class="layer-en">Transport · TCP / UDP</text>

    <rect x="0" y="228" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="248" class="layer-name">3 · 网络层</text>
    <text x="20" y="264" class="layer-en">Network · IP / ICMP / OSPF</text>

    <rect x="0" y="270" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="290" class="layer-name">2 · 数据链路层</text>
    <text x="20" y="306" class="layer-en">Data Link · Ethernet / Wi-Fi</text>

    <rect x="0" y="316" width="360" height="42" rx="4" class="left-block"/>
    <text x="20" y="336" class="layer-name">1 · 物理层</text>
    <text x="20" y="352" class="layer-en">Physical · 光纤 / 双绞线 / 无线电</text>
  </g>

  <!-- 右列:TCP/IP 四层 -->
  <g transform="translate(500, 90)">
    <rect x="0" y="0" width="300" height="36" rx="6" fill="var(--c-brand)"/>
    <text x="150" y="24" class="col-title" text-anchor="middle">TCP/IP 四层</text>

    <rect x="0" y="44" width="300" height="134" rx="4" class="right-block"/>
    <text x="20" y="68" class="layer-name" fill="var(--c-brand)">应用层</text>
    <text x="20" y="84" class="layer-en">Application · HTTP / DNS / TLS</text>
    <text x="20" y="105" class="note" fill="var(--c-text-soft)">合并了 OSI 的 7+6+5</text>
    <text x="20" y="124" class="merge-label">⚡ 合并</text>

    <rect x="0" y="182" width="300" height="42" rx="4" class="right-block"/>
    <text x="20" y="202" class="layer-name" fill="var(--c-brand)">传输层</text>
    <text x="20" y="218" class="layer-en">Transport · TCP / UDP / QUIC</text>

    <rect x="0" y="228" width="300" height="42" rx="4" class="right-block"/>
    <text x="20" y="248" class="layer-name" fill="var(--c-brand)">网络层</text>
    <text x="20" y="264" class="layer-en">Internet · IP / ICMP</text>

    <rect x="0" y="274" width="300" height="84" rx="4" class="right-block"/>
    <text x="20" y="298" class="layer-name" fill="var(--c-brand)">网络接口层</text>
    <text x="20" y="314" class="layer-en">Link · Ethernet / Wi-Fi</text>
    <text x="20" y="335" class="note" fill="var(--c-text-soft)">合并了 OSI 的 2+1</text>
  </g>

  <!-- 中间连接箭头 -->
  <g>
    <line x1="400" y1="65" x2="500" y2="80" class="arrow"/>
    <line x1="400" y1="111" x2="500" y2="100" class="arrow"/>
    <line x1="400" y1="157" x2="500" y2="120" class="arrow"/>
    <text x="410" y="50" class="merge-label">合并</text>

    <line x1="400" y1="203" x2="500" y2="203" class="arrow"/>
    <line x1="400" y1="249" x2="500" y2="249" class="arrow"/>
    <line x1="400" y1="291" x2="500" y2="305" class="arrow"/>
    <line x1="400" y1="337" x2="500" y2="325" class="arrow"/>
  </g>
</svg>
