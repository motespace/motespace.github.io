<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif">
  <style>
    :root {
      --c-text: #1f2937;
      --c-text-2: #374151;
      --c-text-soft: #6b7280;
      --c-border: #d1d5db;
      --c-bg-soft: #f9fafb;
      --c-brand-soft: #eef2ff;
      --c-brand: #3451b2;
      --c-brand-alt: #6366f1;
      --c-success: #10b981;
      --c-success-soft: #d1fae5;
      --c-success-2: #059669;
      --c-warning: #f59e0b;
      --c-warning-soft: #fffbeb;
      --c-warning-2: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6;
        --c-text-2: #d1d5db;
        --c-text-soft: #9ca3af;
        --c-border: #4b5563;
        --c-bg-soft: #1f2937;
        --c-brand-soft: #312e81;
        --c-brand: #818cf8;
        --c-brand-alt: #a5b4fc;
        --c-success: #34d399;
        --c-success-soft: #064e3b;
        --c-success-2: #34d399;
        --c-warning: #fbbf24;
        --c-warning-soft: #451a03;
        --c-warning-2: #fbbf24;
      }
    }

    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 15px; fill: var(--c-text-soft); }
    .layer-num { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .layer-name { font-size: 15px; font-weight: 700; fill: var(--c-text); }
    .layer-desc { font-size: 13px; fill: var(--c-text-2); }
    .layer-time { font-size: 12px; font-weight: 600; fill: var(--c-text-soft); }
    .arrow-down { stroke: var(--c-text-soft); stroke-width: 1.5; fill: none; marker-end: url(#arrow-d); }
    .arrow-rec { stroke: var(--c-warning-2); stroke-width: 1.5; fill: none; marker-end: url(#arrow-y); }
    .hit { font-size: 12px; font-weight: 700; fill: var(--c-success-2); }
    .miss { font-size: 12px; font-weight: 700; fill: var(--c-warning-2); }
    .box-cache-1 { fill: var(--c-success-soft); stroke: var(--c-success-2); stroke-width: 1.5; }
    .box-cache-4 { fill: var(--c-warning-soft); stroke: var(--c-warning-2); stroke-width: 1.5; }
    .box-server { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .query-label { font-size: 13px; fill: var(--c-text-soft); font-style: italic; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawR { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .layer { opacity: 0; animation: fadeUp 0.4s ease-out forwards; }
    .layer-1 { animation-delay: 0.2s; }
    .layer-2 { animation-delay: 0.6s; }
    .layer-3 { animation-delay: 1.0s; }
    .layer-4 { animation-delay: 1.4s; }
    .rec { opacity: 0; animation: drawR 0.4s ease-out forwards; }
    .rec-1 { animation-delay: 1.9s; }
    .rec-2 { animation-delay: 2.4s; }
    .rec-3 { animation-delay: 2.9s; }
    .rec-4 { animation-delay: 3.4s; }
    @media (prefers-reduced-motion: reduce) { .layer, .rec { opacity: 1; animation: none; } }
  </style>

  <defs>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-text-soft)"/>
    </marker>
    <marker id="arrow-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-warning-2)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="40" class="title">DNS 解析完整流程</text>
  <text x="40" y="62" class="subtitle">从浏览器输入域名到拿到 IP · 缓存命中 &lt; 1ms,递归查询 20~200ms</text>

  <!-- ===== 左列:缓存链 ===== -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" class="layer-name" font-size="16" fill="var(--c-brand)">① 本地缓存链(自上而下查找)</text>
    <text x="0" y="20" class="query-label">查询:www.example.com 的 IP 是多少?</text>
  </g>

  <!-- 缓存 1:浏览器 -->
  <g transform="translate(40, 140)">
    <g class="layer layer-1">
      <rect x="0" y="0" width="380" height="56" rx="6" class="box-cache-1"/>
      <circle cx="28" cy="28" r="14" fill="var(--c-success-2)"/>
      <text x="28" y="34" class="layer-num" text-anchor="middle">1</text>
      <text x="56" y="22" class="layer-name">浏览器缓存</text>
      <text x="56" y="42" class="layer-desc">Chrome 约 60s ~ 30min,命中后直接返回</text>
      <text x="320" y="34" class="hit" text-anchor="middle">✓ 命中 ~1ms</text>
    </g>
  </g>

  <line x1="230" y1="200" x2="230" y2="225" class="arrow-down"/>

  <!-- 缓存 2:系统 -->
  <g transform="translate(40, 230)">
    <g class="layer layer-2">
      <rect x="0" y="0" width="380" height="56" rx="6" class="box-cache-1"/>
      <circle cx="28" cy="28" r="14" fill="var(--c-success-2)"/>
      <text x="28" y="34" class="layer-num" text-anchor="middle">2</text>
      <text x="56" y="22" class="layer-name">系统 DNS 缓存</text>
      <text x="56" y="42" class="layer-desc">操作系统的 DNS 解析器缓存(macOS / Windows)</text>
      <text x="320" y="34" class="hit" text-anchor="middle">✓ 命中 ~1ms</text>
    </g>
  </g>

  <line x1="230" y1="290" x2="230" y2="315" class="arrow-down"/>

  <!-- 缓存 3:hosts 文件 -->
  <g transform="translate(40, 320)">
    <g class="layer layer-3">
      <rect x="0" y="0" width="380" height="56" rx="6" class="box-cache-1"/>
      <circle cx="28" cy="28" r="14" fill="var(--c-success-2)"/>
      <text x="28" y="34" class="layer-num" text-anchor="middle">3</text>
      <text x="56" y="22" class="layer-name">hosts 文件</text>
      <text x="56" y="42" class="layer-desc">/etc/hosts (mac/Linux) · C:\Windows\System32\drivers\etc\hosts</text>
      <text x="320" y="34" class="hit" text-anchor="middle">✓ 命中 ~1ms</text>
    </g>
  </g>

  <line x1="230" y1="380" x2="230" y2="405" class="arrow-down"/>

  <!-- 缓存 4:本地 DNS(LDNS)未命中 -->
  <g transform="translate(40, 410)">
    <g class="layer layer-4">
      <rect x="0" y="0" width="380" height="56" rx="6" class="box-cache-4"/>
      <circle cx="28" cy="28" r="14" fill="var(--c-warning-2)"/>
      <text x="28" y="34" class="layer-num" text-anchor="middle">4</text>
      <text x="56" y="22" class="layer-name">本地 DNS 服务器(LDNS)</text>
      <text x="56" y="42" class="layer-desc">运营商分配 · 8.8.8.8 / 114.114.114.120 / 1.1.1.1</text>
      <text x="320" y="34" class="miss" text-anchor="middle">✗ 未命中</text>
    </g>
  </g>

  <!-- ===== 右列:递归查询 ===== -->
  <g transform="translate(450, 100)">
    <text x="0" y="0" class="layer-name" font-size="16" fill="var(--c-warning-2)">② 递归查询(LDNS 代劳)</text>
    <text x="0" y="20" class="query-label">LDNS → 根 → TLD → 权威 DNS,层层问下去</text>
  </g>

  <!-- Root DNS -->
  <g transform="translate(450, 140)">
    <g class="rec rec-1">
      <rect x="0" y="0" width="390" height="76" rx="6" class="box-server"/>
      <text x="14" y="22" class="layer-name">根 DNS 服务器</text>
      <text x="14" y="42" class="layer-desc">全球 13 组(A~M),返回 .com TLD 服务器地址</text>
      <text x="14" y="62" class="layer-time">响应:找 .com 的 NS 列表,LDNS 自己去问</text>
    </g>
  </g>

  <!-- TLD DNS -->
  <g transform="translate(450, 230)">
    <g class="rec rec-2">
      <rect x="0" y="0" width="390" height="76" rx="6" class="box-server"/>
      <text x="14" y="22" class="layer-name">.com TLD DNS 服务器</text>
      <text x="14" y="42" class="layer-desc">VeriSign 运维,管理所有 .com 域名的权威 NS</text>
      <text x="14" y="62" class="layer-time">响应:example.com 的权威 NS 在 ns1.cloudflare.com</text>
    </g>
  </g>

  <!-- Authoritative DNS -->
  <g transform="translate(450, 320)">
    <g class="rec rec-3">
      <rect x="0" y="0" width="390" height="76" rx="6" class="box-server"/>
      <text x="14" y="22" class="layer-name">权威 DNS 服务器</text>
      <text x="14" y="42" class="layer-desc">域名注册商或 DNS 服务商(Cloudflare / Route53 / DNSPod)</text>
      <text x="14" y="62" class="layer-time">响应:www.example.com → 93.184.216.34</text>
    </g>
  </g>

  <!-- 返回客户端 -->
  <g transform="translate(450, 410)">
    <g class="rec rec-4">
      <rect x="0" y="0" width="390" height="76" rx="6" class="box-server" fill="var(--c-success-soft)" stroke="var(--c-success)"/>
      <text x="14" y="22" class="layer-name" fill="var(--c-success-2)">返回客户端 · 建立 TCP 连接</text>
      <text x="14" y="42" class="layer-desc">LDNS 缓存结果(TTL 时间内复用) · 回传给浏览器</text>
      <text x="14" y="62" class="layer-time">浏览器:拿到 IP → 发起 TCP 握手 · 整个过程 20~200ms</text>
    </g>
  </g>

  <!-- 递归查询连线(右侧三个服务器之间的箭头) -->
  <line x1="645" y1="216" x2="645" y2="230" class="arrow-rec"/>
  <line x1="645" y1="306" x2="645" y2="320" class="arrow-rec"/>
  <line x1="645" y1="396" x2="645" y2="410" class="arrow-rec"/>
</svg>
