<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="880" height="470" fill="var(--c-bg)"/>

  <style>
    :root {
      --c-text: #1f2937; --c-bg: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db;
      --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff;
      --c-success: #10b981; --c-success-soft: #d1fae5;
      --c-warning: #f59e0b; --c-warning-soft: #fffbeb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-text-soft: #9ca3af; --c-border: #4b5563;
        --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81;
        --c-success: #34d399; --c-success-soft: #064e3b;
        --c-warning: #fbbf24; --c-warning-soft: #451a03;
      }
    }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .layer-box { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1.5; }
    .layer-brand { fill: var(--c-brand-soft); stroke: var(--c-brand); stroke-width: 1.5; }
    .layer-success { fill: var(--c-success-soft); stroke: var(--c-success); stroke-width: 1.5; }
    .layer-warning { fill: var(--c-warning-soft); stroke: var(--c-warning); stroke-width: 1.5; }
    .layer-title { font-size: 16px; font-weight: 700; fill: var(--c-text); }
    .layer-sub { font-size: 13px; fill: var(--c-text); }
    .layer-sub-soft { font-size: 13px; fill: var(--c-text-soft); }
    .code { font-family: Consolas, Monaco, monospace; font-size: 13px; fill: var(--c-text); }
    .flow { stroke: var(--c-text-soft); stroke-width: 2; fill: none; }
    .flow-head { fill: var(--c-text-soft); }
    .phase { font-size: 15px; font-weight: 700; fill: var(--c-brand); }
    .lifeline { stroke: var(--c-border); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .msg { font-size: 13px; fill: var(--c-text); }
    .msg-soft { font-size: 13px; fill: var(--c-text-soft); }
  </style>

  <text x="40" y="42" class="title">两台设备,两种角色</text>
  <text x="40" y="66" class="subtitle">Windows 当主力 AI Lab,Mac 当随身开发与面试练习机</text>

  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="390" height="300" class="layer-brand" rx="8"/>
    <text x="20" y="30" class="layer-title">🪟 Windows · AI Lab</text>
    <text x="20" y="54" class="layer-sub-soft">主力环境:跑模型、跑向量库、跑容器</text>
    <text x="20" y="86" class="layer-sub" style="font-weight: 700;">工具链</text>
    <rect x="20" y="100" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="119" class="code" text-anchor="middle">VS Code</text>
    <rect x="20" y="136" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="155" class="code" text-anchor="middle">Git</text>
    <rect x="20" y="172" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="191" class="code" text-anchor="middle">Node.js</text>
    <rect x="20" y="208" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="227" class="code" text-anchor="middle">pnpm</text>
    <rect x="20" y="244" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="263" class="code" text-anchor="middle">Python</text>
    <rect x="140" y="100" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="119" class="code" text-anchor="middle">uv</text>
    <rect x="140" y="136" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="155" class="code" text-anchor="middle">Docker Desktop</text>
    <rect x="140" y="172" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="191" class="code" text-anchor="middle">Ollama</text>
    <rect x="140" y="208" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="227" class="code" text-anchor="middle">PostgreSQL</text>
    <text x="20" y="238" class="layer-sub" style="font-weight: 700;">工作目录</text>
    <text x="20" y="258" class="code">D:\AI\</text>
    <text x="20" y="282" class="code">01-python / 02-llm / 03-fastapi</text>
    <text x="20" y="296" class="code">04-rag / 05-agent / 06-mcp / projects</text>
  </g>

  <g transform="translate(450, 96)">
    <rect x="0" y="0" width="390" height="300" class="layer-success" rx="8"/>
    <text x="20" y="30" class="layer-title">🍎 Mac · 移动开发环境</text>
    <text x="20" y="54" class="layer-sub-soft">随身环境:随时开机写前端、做面试题</text>
    <text x="20" y="86" class="layer-sub" style="font-weight: 700;">工具链</text>
    <rect x="20" y="100" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="119" class="code" text-anchor="middle">React</text>
    <rect x="20" y="136" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="155" class="code" text-anchor="middle">Next.js</text>
    <rect x="20" y="172" width="110" height="28" class="chip" rx="14"/>
    <text x="75" y="191" class="code" text-anchor="middle">TypeScript</text>
    <rect x="140" y="100" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="119" class="code" text-anchor="middle">Git</text>
    <rect x="140" y="136" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="155" class="code" text-anchor="middle">Python</text>
    <rect x="140" y="172" width="110" height="28" class="chip" rx="14"/>
    <text x="195" y="191" class="code" text-anchor="middle">FastAPI</text>
    <text x="20" y="238" class="layer-sub" style="font-weight: 700;">典型场景</text>
    <text x="20" y="262" class="layer-sub">· 咖啡店 / 图书馆写代码</text>
    <text x="20" y="284" class="layer-sub">· 面试前刷题、改简历</text>
  </g>

  <text x="40" y="440" class="subtitle">📡 重型依赖(模型 / 向量库 / 容器)只装在一台机器上,另一台保持轻量</text>
</svg>
