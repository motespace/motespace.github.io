<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect class="canvas-bg" x="0" y="0" width="820" height="450" fill="var(--c-bg)"/>

  <style>
    :root { --c-text: #1f2937; --c-bg: #ffffff; --c-text-soft: #6b7280; --c-border: #d1d5db; --c-bg-soft: #f9fafb; --c-brand: #3451b2; --c-brand-soft: #eef2ff; --c-warning: #f59e0b; --c-warning-soft: #fef3c7; --c-danger: #ef4444; }
    @media (prefers-color-scheme: dark) { :root { --c-text: #f3f4f6; --c-bg: #1b1b1f; --c-text-soft: #9ca3af; --c-border: #4b5563; --c-bg-soft: #1f2937; --c-brand: #818cf8; --c-brand-soft: #312e81; --c-warning: #fbbf24; --c-warning-soft: #451a03; --c-danger: #f87171; } }
    .title { font-size: 22px; font-weight: 700; fill: var(--c-text); }
    .subtitle { font-size: 14px; fill: var(--c-text-soft); }
    .panel-title { font-size: 17px; font-weight: 700; }
    .step { fill: var(--c-bg-soft); stroke: var(--c-border); stroke-width: 1.5; rx: 8; }
    .step-text { font-size: 14px; fill: var(--c-text); text-anchor: middle; }
    .arrow { fill: none; stroke: var(--c-text-soft); stroke-width: 2; }
    .note { font-size: 14px; fill: var(--c-text-soft); }
    .divider { stroke: var(--c-border); stroke-width: 1; stroke-dasharray: 5 5; }
  </style>

  <text x="40" y="42" class="title">jQuery 直接操作 DOM vs Vue 数据驱动</text>
  <text x="40" y="66" class="subtitle">同一个「点击下一步」的需求,两种写法的流程差多少</text>

  <line x1="410" y1="92" x2="410" y2="412" class="divider"/>

  <text x="60" y="106" class="panel-title" fill="var(--c-danger)">jQuery:手动操作 DOM</text>
  <text x="450" y="106" class="panel-title" fill="var(--c-brand)">Vue:只改数据</text>

  <g>
    <rect x="60" y="132" width="300" height="48" class="step" fill="var(--c-warning-soft)" stroke="var(--c-warning)"/>
    <text x="210" y="162" class="step-text">用户点击「下一步」</text>
    <path d="M 210 180 L 210 200" class="arrow"/>
    <rect x="60" y="206" width="300" height="48" class="step"/>
    <text x="210" y="236" class="step-text">手动 find 当前 DOM 节点</text>
    <path d="M 210 254 L 210 274" class="arrow"/>
    <rect x="60" y="280" width="300" height="48" class="step"/>
    <text x="210" y="310" class="step-text">手动改样式 / 隐藏它</text>
    <path d="M 210 328 L 210 348" class="arrow"/>
    <rect x="60" y="354" width="300" height="48" class="step"/>
    <text x="210" y="384" class="step-text">再手动 find 下一个 DOM</text>
  </g>

  <g>
    <rect x="450" y="132" width="300" height="48" class="step" fill="var(--c-warning-soft)" stroke="var(--c-warning)"/>
    <text x="600" y="162" class="step-text">用户点击「下一步」</text>
    <path d="M 600 180 L 600 200" class="arrow"/>
    <rect x="450" y="206" width="300" height="48" class="step" fill="var(--c-brand-soft)" stroke="var(--c-brand)"/>
    <text x="600" y="236" class="step-text">改一个变量:step++</text>
    <path d="M 600 254 L 600 274" class="arrow"/>
    <rect x="450" y="280" width="300" height="48" class="step" fill="var(--c-brand-soft)" stroke="var(--c-brand)"/>
    <text x="600" y="310" class="step-text">响应式系统发现数据变了</text>
    <path d="M 600 328 L 600 348" class="arrow"/>
    <rect x="450" y="354" width="300" height="48" class="step" fill="var(--c-brand-soft)" stroke="var(--c-brand)"/>
    <text x="600" y="384" class="step-text">框架自动更新对应 DOM</text>
  </g>

  <text x="40" y="432" class="note">Vue 基本不直接操作 DOM 节点 —— 双向绑定把 DOM 和数据绑在一起,改数据就等于改视图。</text>
</svg>
